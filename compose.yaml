name: destination-search

services:
  db:
    image: postgis/postgis:18-3.6
    container_name: destsearch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-destination_search}
      POSTGRES_USER: ${POSTGRES_USER:-destsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-destsearch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-destsearch} -d ${POSTGRES_DB:-destination_search}"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    container_name: destsearch-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:8.10-alpine
    container_name: destsearch-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: destsearch-web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-core.settings}
      DEBUG: ${DEBUG:-1}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-destination_search}
      POSTGRES_USER: ${POSTGRES_USER:-destsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-destsearch}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - .:/app
      - ./data:/app/data:ro
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # One-off seeding — does NOT start with `docker compose up`.
  # Run explicitly, once, after the stack is up:
  #   docker compose --profile seed run --rm seed
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: destsearch-seed
    profiles: ["seed"]
    command: python manage.py seed_destinations data/cities.csv
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-core.settings}
      POSTGRES_DB: ${POSTGRES_DB:-destination_search}
      POSTGRES_USER: ${POSTGRES_USER:-destsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-destsearch}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - .:/app
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  esdata: